name: Release Certification
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact deployed candidate SHA
        required: true
        type: string
      evidence_json:
        description: Non-sensitive release evidence with attributable review references
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify mandatory release evidence
        env:
          EXPECTED_GIT_SHA: ${{ inputs.candidate_sha }}
          RELEASE_EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: node scripts/certify-release.mjs
