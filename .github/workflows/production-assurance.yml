name: Production Assurance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify required staging secrets are configured
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY STAGING_TEST_PASSWORD STAGING_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is not configured for Production Assurance"
              missing=1
            fi
          done
          exit "$missing"
      - name: Verify canonical LHG staging identity
        shell: bash
        run: |
          expected_ref="rpszhpjmchirzzndasrb"
          actual_ref="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | sed -E 's#^https://([^.]+)\.supabase\.co/?$#\1#')"
          if [ "$actual_ref" != "$expected_ref" ]; then
            echo "::error title=Wrong Supabase staging project::Production Assurance is configured for a non-canonical Supabase project."
            exit 1
          fi
          echo "Canonical LHG staging project verified: $expected_ref"
      - name: Verify Supabase REST reachability
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --connect-timeout 5 --max-time 15             --output /tmp/supabase-rest.json --write-out '%{http_code}'             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/profiles?select=id&limit=0")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Supabase REST preflight failed::Canonical staging REST endpoint returned HTTP $status."
            cat /tmp/supabase-rest.json || true
            exit 1
          fi
          echo "Supabase REST preflight passed (HTTP $status)."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production verification gate
        run: npm run verify:production
      - name: Synchronize synthetic staging identities
        run: npm run staging:create-users
      - name: Staging security and transaction certification
        run: npm run staging:release-gate
      - name: Production build
        run: npm run build
