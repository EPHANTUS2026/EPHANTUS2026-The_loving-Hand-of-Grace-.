name: Production Assurance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify required staging secrets are configured
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY STAGING_TEST_PASSWORD STAGING_BASE_URL EXPECTED_GIT_SHA; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Production Assurance input::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_GIT_SHA" || { echo "::error title=Candidate SHA mismatch::checkout=$actual expected=$EXPECTED_GIT_SHA"; exit 1; }
          echo "Exact candidate checkout PASS: $actual"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production verification gate
        timeout-minutes: 12
        run: npm run verify:production
      - name: Verify exact staging deployment identity
        timeout-minutes: 2
        env:
          GITHUB_SHA: ${{ env.EXPECTED_GIT_SHA }}
        run: npm run staging:deployment-identity
      - name: Synchronize synthetic staging identities
        timeout-minutes: 8
        run: npm run staging:create-users
      - name: Staging security and transaction certification
        timeout-minutes: 30
        run: npm run staging:release-gate
      - name: Production build
        timeout-minutes: 10
        run: npm run build
